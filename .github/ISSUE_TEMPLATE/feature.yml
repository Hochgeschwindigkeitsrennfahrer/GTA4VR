name: New feature or behavior change
description: "Choose when something isn't broken, but you want it to be better."
body:
  - type: textarea
    id: desired
    validations:
      required: true
    attributes:
      label: What should happen
      placeholder: |
        Describe the VR interaction or feature you would like to improve.
      description: >
        Be specific and descriptive.

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: "Check the [latest git build](https://github.com/bordplate/GTA4VR/actions/workflows/msvc_x86.yml) in case it's already implemented."
          required: true
        - label: "[Search for other requests](https://github.com/bordplate/GTA4VR/issues) of the same feature."
          required: true
