name: GTA4VR Build and Release

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        type: choice
        required: false
        default: 'false'
        options:
          - 'true'
          - 'false'
      version_increment:
        description: "Default semantic version release type"
        type: choice
        required: false
        default: 'minor'
        options:
          - 'major'
          - 'minor'
          - 'patch'

env:
  VERINC: ${{ github.event.inputs.version_increment || 'patch' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@main

    - name: Auto Increment Version
      if: github.event_name != 'pull_request'
      uses: MCKanpolat/auto-semver-action@1.0.12
      id: versioning
      with:
        releaseType: ${{ env.VERINC }}
        incrementPerCommit: false
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure build
      run: ./premake5 vs2026 --with-version=${{ steps.versioning.outputs.version || '0.1.0' }}

    - name: Build x86 OpenXR loader
      run: |
        cmake -S external/openxr-sdk -B build/openxr-loader-win32 -G "Visual Studio 18 2026" -A Win32 -DDYNAMIC_LOADER=ON -DBUILD_TESTS=OFF
        cmake --build build/openxr-loader-win32 --config Release --target openxr_loader --parallel 4

    - name: Build
      run: msbuild -m build/GTAIV.EFLC.FusionFix.slnx /property:Configuration=Release /property:Platform=Win32

    - name: Download Ultimate ASI Loader x86
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "ThirteenAG/Ultimate-ASI-Loader"
        tag: "Win32-latest"
        fileName: "dinput8-Win32.zip"

    - name: Download DXVK
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "doitsujin/dxvk"
        tag: 'v3.1.1'
        fileName: "dxvk-*.tar.gz"

    - name: Unpack dependencies
      shell: cmd
      run: |
          7z x dinput8-Win32.zip -odata/ -y
          del dinput8-Win32.zip
          del data\dinput8-Win32.SHA512
          for %%f in (dxvk-*.tar.gz) do 7z x -so "%%f" | 7z x -si -ttar -odxvk
          for /d %%d in (dxvk\dxvk-*) do if exist "%%d\x32\d3d9.dll" copy "%%d\x32\d3d9.dll" "data\vulkan.dll"
          rmdir /s /q dxvk

    - name: Pack binaries
      run: |
        ./release.bat
      env:
        CODE_SIGNING_PFX: ${{ github.ref_name == 'master' && (github.event_name == 'push' || github.event.inputs.release == 'true') && secrets.CODE_SIGNING_PFX || '' }}
        CODE_SIGNING_PASSWORD: ${{ github.ref_name == 'master' && (github.event_name == 'push' || github.event.inputs.release == 'true') && secrets.CODE_SIGNING_PASSWORD || '' }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: GTA4VR.zip

    - name: Upload artifact (asi)
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/plugins/GTAIV.EFLC.FusionFix.asi

    - name: Upload Web Installer
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: GTAIV.EFLC.FusionFixWebInstaller.exe

    - name: Upload Offline Installer
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: GTAIV.EFLC.FusionFixOfflineInstaller.exe

    - name: Upload Release
      if: |
        github.event.inputs.release == 'true' &&
        github.ref_name == 'master' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.repository == 'bordplate/GTA4VR'
      uses: ncipollo/release-action@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: false
        name: GTA4VR v${{ steps.versioning.outputs.version || '0.1.0' }}
        body: "[README](https://github.com/bordplate/GTA4VR#readme)"
        tag: v${{ steps.versioning.outputs.version || '0.1.0' }}
        artifacts: GTA4VR.zip, GTAIV.EFLC.FusionFixWebInstaller.exe, GTAIV.EFLC.FusionFixOfflineInstaller.exe

