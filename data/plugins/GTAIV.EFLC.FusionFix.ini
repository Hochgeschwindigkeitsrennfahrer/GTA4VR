[MAIN]
RecoilFix = 1                                 // make recoil behavior the same as controller when playing with keyboard and mouse
AimingZoomFix = 1                             // -1: TBoGT aiming zoom behaves like IV and TLaD | 0: disable the fix | 1: TBoGT aiming zoom behaves like xbox feature | 2: have this feature also enabled in IV and TLaD

[VR]
ShowFirstPersonBody = 1                      // visible tracked body with head hidden in VR
ExperimentalHandPhysics = 0                // native dynamic hand/forearm collision objects; requires hand IK
ExperimentalHandGrab = 0                   // grip-driven native physical prop attachments; requires hand physics
ExperimentalHandCombat = 0                 // tracked punches, knife, baseball bat and pool cue; requires hand physics
HandPunchSpeed = 1.6                       // minimum tracked fist speed in metres/sec; 0.8..5.0; restart to apply
HandPunchDamage = 25.0                     // native unarmed damage per strike; 1..100; restart to apply
HandKnifeSpeed = 1.2                       // minimum blade speed in metres/sec; 0.5..5.0; restart to apply
HandKnifeDamage = 25.0                     // native knife damage per strike; 1..100; restart to apply
HandClubSpeed = 1.2                        // minimum bat/cue contact speed in metres/sec; 0.5..5.0; restart to apply
HandClubDamage = 30.0                      // native bat/cue damage per strike; 1..100; restart to apply
HandPhysicsArmForce = 250.0                 // total force budget per arm, native units; 25..1000; restart to apply
HandGrabForce = 900.0                       // held-object motor force per hand; 25..3000; separate from arm contact; restart to apply
HandThrowVelocityScale = 4.0               // release speed multiplier for grabbed props; mass/strength still apply; restart to apply
ThrowableVelocityScale = 4.0               // grenade/Molotov tracked release speed multiplier; restart to apply
HandGrabRadius = 0.22                       // palm acquisition radius in metres for props and car doors; 0.05..0.35; restart to apply
HandPhysicsRecoveryDistance = 0.75          // metres: recover blocked arm to tracking after this separation
EnableOpenXR = 0                             // 0: flat screen (default) | 1: opt-in experimental OpenXR session
ExperimentalVulkanBridge = 0                 // requires d3d9.cfg API=1; experimental DXVK/OpenXR copy path
VulkanOpenVRBootstrap =                      // optional absolute path to SteamVR's x86 openvr_api.dll; preload before DXVK device creation
MatchHeadsetRefresh = 1                      // lets xrWaitFrame pace active stereo instead of the gameplay FPS limiter; safety limits still apply
ExperimentalFirstPerson = 0                  // experimental gameplay head anchors; requires experimental stereo, camera-state coverage remains under test
FirstPersonForwardOffset = 0.08               // meters of on-foot head/body placement; shifts visible tracked body back, retains eye/controller origin
ExperimentalHeadRelativeMovement = 0         // on-foot keyboard/gamepad direction follows level headset facing; requires ExperimentalFirstPerson
ExperimentalHeadsetAim = 0                   // experimental on-foot weapon aiming follows headset; suppresses controller lock-on while active
ExperimentalRoomScale = 0                    // experimental collision-resolved horizontal room movement; requires ExperimentalFirstPerson
ExperimentalPhysicalCrouch = 0               // floor-relative headset lowering controls native crouch; requires ExperimentalFirstPerson
PlayerHeight = 1.75                          // meters above the tracked floor; crouch enters at 65%, exits at 75%; pause-menu calibration planned
VehicleEyeHeightOffset = 0.075                // meters above the calibrated seated head point, clamped to -0.3..0.5; requires ExperimentalFirstPerson
WheelGripRadius = 0.18                       // metres of palm-to-rim grab tolerance; restart to apply
WheelSteeringDegrees = 180.0                 // physical wheel rotation from centre to full steering; positive, restart to apply
WheelRadius = 0.17                          // fallback rim radius when native mesh fitting is unavailable; positive
WheelTiltDegrees = 20.0                     // fallback wheel plane tilt from vertical
WheelCenterRight = 0.0                      // metres of offset from fitted wheel centre (native palms for fallback), vehicle axes
WheelCenterForward = 0.0
WheelCenterUp = 0.0
ExperimentalControllerInput = 0              // Vive Wand trackpad, aim/grip poses and grip button
ExperimentalControllerLocomotion = 0         // left touchpad contact/XY for headset-relative on-foot movement; requires controller input and head-relative movement
ExperimentalHandIK = 0                       // experimental native player-arm IK from controller grip poses; requires controller input
WristRadar = 0                              // native radar/health/armor panel attached to tracked left forearm
WorldSpaceScreens = 1                       // with VR enabled: native loading/pause image on a world-space screen
ViewHud = 1                                 // with VR enabled: view-attached native text and popup HUD
ViewHudWidth = 0.5                          // half-width/distance of centred stereo HUD plane; 0.20..0.70
ViewHudDistance = 2.0                        // metres in front of head; 1.0..4.0
WristRadarSize = 0.10                        // panel diameter in metres; 0.06..0.30
WristRadarBackOffset = 0.075                 // metres from wrist toward elbow; 0..0.25
WristRadarLift = 0.04                        // metres above wrist surface; 0.01..0.15
DashboardRadar = 1                          // with WristRadar enabled: car-fixed panel instead of wrist; bikes retain wrist
DashboardRadarSize = 0.16                   // panel diameter in metres; 0.08..0.35
DashboardRadarForward = 0.55                // metres forward from stable seat eye anchor; 0.15..1.50
DashboardRadarDown = 0.32                   // metres below seat eye anchor; -0.10..0.80
DashboardRadarRight = 0.45                  // metres right of seat eye anchor; -2.00..2.00
DashboardRadarTilt = 12                     // degrees tilted upward toward driver; -45..60
ExperimentalBodyHeight = 0                   // fit tracked visible body to PlayerHeight using authored rig; native collision size retained
ExperimentalTrackedBody = 0                  // tracked torso height/knees, hand-led idle facing and traversal-led body yaw; requires hand IK/body height
BodyVerticalOffset = 0.10                    // meters upward for the visible tracked body; compensates wrist targets and standing knee allowance
BodyHeadAllowance = 0.25                     // estimated head-bone-to-crown distance in meters for visible height fitting
BodyHeightScale = 1.0                        // additional visible-body fit multiplier; does not affect camera height or crouch thresholds
ExperimentalSupportGrip = 0                  // hold left grip near supported weapon gun_grip2 to attach; release to detach
ExperimentalWeaponSwap = 0                   // right Wand pad left/right clicks cycle owned weapons; requires tracked hands
ExperimentalControllerButtons = 0            // right menu enter/exit; center click jump/handbrake; triggers/pad driving
HandGripRotationLeft =                       // optional calibrated grip-to-rig quaternion x y z w; empty keeps default
HandGripRotationRight =                      // optional calibrated grip-to-rig quaternion x y z w; empty keeps default
ExperimentalFingerGrip = 0                   // experimental grip fingers, analog trigger index, trackpad thumb; requires hand IK
ExperimentalPistolAim = 0                    // tracked muzzle/aim reactions for standard pistol and M4; requires hand IK
PistolAimRaiseBelowHead = 0.40               // meters below current HMD height: raised supported gun triggers native NPC aim reactions
ExperimentalPistolTrigger = 0                // right trigger: semi-auto pistol, automatic M4; requires tracked muzzle path
ExperimentalPhysicalReload = 0               // pistol/M4: eject, shoulder magazine, insert, rack; requires Animated Weapons dependency

[DEVELOPMENT]
DiagnosticLogging = 0                       // VR log files and debugger output; restart to apply
DiagnosticCounters = 0                      // passive gameplay/visibility counters and status snapshots
DiagnosticObservationHooks = 0              // bullet damage and ragdoll deactivation observers; restart
DiagnosticAutomaticCaptures = 0             // automatic stereo/depth/shader readback after startup/reset
EnableCommandBridge = 0                      // local current-user named pipe for status/quit during development
VulkanDebugMode =                           // optional DXVK hang, validation or markers diagnostics; leave empty for performance captures

[CAMERASENSITIVITY]
MouseLookSensitivityRange = 0.1, 2.0          // min and max range for mouse look sensitivity slider
GamepadLookSensitivityRange = 0.1, 2.0        // min and max range for gamepad look sensitivity slider
MouseAimSensitivityRange = 0.1, 2.0           // min and max range for mouse aim sensitivity slider
GamepadAimSensitivityRange = 0.1, 2.0         // min and max range for gamepad aim sensitivity slider

[SHADOWS]
ExtraDynamicShadows = 2                       // adds back some missing shadows | 1: to some vegetation | 2: to some fences, grates, roads, walls and some vegetation
CascadeBlendSize = 0.1                        // controls the size of the cascade blending region | [0.0; 1.0]
HighResolutionShadows = 0                     // doubles cascaded shadow map resolution, very GPU intensive
ForceShadowFilter = 0                         // 0: blur quality tied to definition | 1: always use low quality | 2: always use high quality

[FRAMELIMIT]
FrameLimitType = 2                            // 1: realtime (thread-lock)  |  2: accurate (sleep-yield), uses less resources
FpsLimit = -2                                 // used when FPS Limit menu toggle is set to Custom (negative values use refresh rate as a base)
CutsceneFpsLimit = 0                          // custom FPS Limit value in cutscene
LoadingFpsLimit = 30                          // used to avoid game freeze on loading (e.g. Off Route mission)
UnlockFramerateDuringLoadscreens = 1          // game loads faster when using frame limiter
MinigamesFpsLimit = 30                        // used to avoid possible issues for specified minigames in MinigamesList
MinigamesList =                               pool_game, air_hockey, arm_wrestling, tenpinbowl, drinking

[MISC]
DefaultCameraAngleInTLaD = 1                  // enforces the default IV camera angle on bikes in TLaD
PedDeathAnimFixFromTBoGT = 1                  // disables the additional death animation performed after counter attacking peds in IV and TLaD, like in TBoGT
DisableCameraCenteringInCover = 1             // disables the forced camera centering after moving to the edge of a wall while in cover
ExtraInfo = 1                                 // shows extra info in the pause menu (e.g. loaded img files amount)
OverrideTreeAlpha = 0.0                       // set to e.g. 0.625, 2.5 or 4.0 for PC, PS3 or X360 tree alpha, respectively
ConsoleCarReflectionsAndDirt = 1              // use stronger console car reflections and any cars can be dirty when they are spawned like console
BrakeLightsWhenStopped = 0                    // lights the players brake lamps while stopped, like AI vehicles do (vanilla only lights them above walking pace)
FixHelicopterSearchlights = 1                 // 0: disabled, searchlights may flicker/fight each other | 1: only one searchlight can be active at a time (for max 10s) | 2: all searchlights can draw independently
AlwaysDisplayHealthOnReticle = 1              // allow game to display NPC health on the reticle when playing with keyboard and mouse
SmoothShorelines = 1                          // makes water edges smooth and adjusts foam noise
SmoothLightVolumes = 1                        // makes light volume edges smooth
NoBloomColorShift = 1                         // prevents bloom threshold from causing wild color shifts when tone mapping is enabled
MenuEnteringDelay = 0                         // 400:  default | 0: no delay
MenuExitingDelay = 0                          // 800:  default | 0: no delay
MenuAccessDelayOnStartup = 0                  // 3000: default | 0: no delay
RadarZoomDelay = 3000                         // 0:    default | 3000: 3s delay
DeathMusic = 0                                // plays cut death music when player is dead in IV
AutoClimbLaddersRange = 1.5                   // how close you must be to auto-climb, in units (the game uses 4.0 for a manual button press)
PlayerJumpRagdollControl = 0                  // allows triggering a ragdoll on demand by pressing the reload key while jumping, like in GTAV
PlayerClimbRagdollControl = 0                 // also allows triggering a ragdoll on demand by pressing the reload key while climbing

[FOG]
VolFogFarClip = 4500.0                        // override far clip for volumetric fog
ExtendedTimecycEditing = 0                    // 0: disabled | 1: display debug info and reload .dat with F3

[BudgetedIV]
VehicleBudget = 0                             // used to avoid "Taxi Bug", may cause vehicle audio issue
PedBudget = 0                                 // may cause issues
ExtendedLimits = 0                            // increases various limits like modelinfo, handling, carcols, some pools size

[EPISODICCONTENT]
EpisodicVehicles = 0                          // Support for APC, Buzzard, smuggler, floater, blade and all their abilities in IV and TLaD
EpisodicWeapons = 0                           // Support for DSR1, Grenade launcher, Pipe bomb, Sticky bomb, AA12 explosive shells, P90 vehicle check, Parachute and all their abilities in IV, TLaD and TBoGT
ExplosiveAnnihilator = 0                      // Enables explosive rounds on Annihilator in IV, requires ep weapons
OtherEpisodicChecks = 0                       // Support for Disco camera bobbing, Cell Phone switching, Altimeter in helicopters and parachute, Explosive sniper and fists cheat in IV and TLaD, requires related ep files
TBoGTHelicopterHeightLimit = 0                // Raises IV and TLaD height limit for helicopters to TBoGT level
TBoGTPoliceWeapons = 0                        // Gives P90 and AA12 to SWAT and FIB and M249 to police in helicopters in IV and TLaD. Requires ep weapons
RemoveSCOSignatureCheck = 0                   // Allows using any episodic SCO on all episodes
EpisodicDeathMusic = 0                        // Allows the restored death music to play in all episodes. Requires custom sound files added per-each episode for it to be unique.

[SUNSHAFTS]
SunShaftsDensity = 0.9                        // How long the rays are. [0.0; 1.0]
SunShaftsDecay = 0.95                         // How fast the rays fade out from the center. [0.0; 1.0]

[POSTFX]
EnablePreAlphaDepth = 1                       // Properly render depth related post-processing effects (e.g depth of field, sunshafts) through windows/transparent objects
AmbientOcclusionBlurPasses = 1
AmbientOcclusionSamples = 9
AmbientOcclusionLogMaxOffset = 3
AmbientOcclusionMaxMipLevel = 5
AmbientOcclusionFarClip = 150.0
AmbientOcclusionRadius = 1.125
AmbientOcclusionBias = 0.03
AmbientOcclusionIntensity = 0.4
AmbientOcclusionBlurRadius = 2.0

[SHADOWFILTERSHARP]                           // CE-like shadows
ShadowSoftness = 1.5                          // controls shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERSOFT]                            // 1.0.4.0-like shadows
ShadowSoftness = 3.0                          // controls shadow blur
ShadowBias = 8.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERCHSS]                            // CHSS / PCSS
ShadowSoftness = 1.5                          // controls minimum shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to minimum softness
MaxSoftness = 20.0                            // controls maximum shadow blur

[PROJECT2DFX]
CoronaRadiusMultiplier = 1.0                  // multiplier for corona radius
CoronaAlphaMultiplier = 1.0                   // multiplier for corona alpha
SlightlyIncreaseRadiusWithDistance = 1        // slight increase in corona radius with distance
DisableDefaultLodLights = 1                   // disable default distant lights

[TURNINDICATORS]
ManualTurnIndicators = 0                      // enable manual turn indicators, tap LB or RB on gamepad to activate
LeftIndicatorKey = 0xDB                       // VK_OEM_4, the Left Brace key
RightIndicatorKey = 0xDD                      // VK_OEM_6, the Right Brace key

[EXPERIMENTAL]
DisplayMemoryStats = 0                        // while the FPS Counter is enabled, it prints some memory counters alongside, like for used streaming memory and memory used by the entire process
ReflectionMSAAQuality = 0                     // Applies MSAA to the reflection maps (exterior, interior, water, mirror) like on Xbox 360. Valid options: 2|4|8, other values are ignored and disable this feature.
