; Combat pistol (native type9), Animated Weapons w_eagle model.
; Measured magazine pivot; leading tip/channel remain provisional for tuning.
; Edit the installed plugins/VRWeapons/deagle.ini, then run:
; tools/game-command.ps1 reload-weapon-config
; Confirm configValid=true and configRevision increases in reload-status.
; Invalid values reject the entire edit and retain the preceding profile.
[Reload]
; Degrees, composed around weapon-local X(barrel), Y(left), Z(up), in X/Y/Z order.
; This only rotates the loose magazine in the hand, not the pistol/calibrated hand.
MagazineHandRotationX=100
MagazineHandRotationY=180
MagazineHandRotationZ=180
; Meters from the left wrist to the magazine bone origin, in hand-local axes.
; X points along the hand/fingers, Y left, Z up.
MagazineHandOffsetX=0.075
MagazineHandOffsetY=0.05
MagazineHandOffsetZ=0.04
; Direction FROM bottom of grip INTO pistol, in weapon-local coordinates.
; Normalized on load. Starting estimate for the slanted combat-pistol grip.
InsertionAxisX=0.258819
InsertionAxisY=0
InsertionAxisZ=0.965926
; Leading magazine point in the model's seated weapon-local coordinates, meters.
; Used for near-opening acquisition; edit this if the snap point is misplaced.
; Mag pivot is -0.075804/0/-0.078823; tip estimated7cm above it.
MagazineTipX=-0.075804
MagazineTipY=0
MagazineTipZ=-0.008823
; Meters to push after initial snap; sphere radius around the entrance.
InsertionTravel=0.085
SnapRadius=0.045
; Cosine of maximum axis misalignment (0.5 permits up to60deg).
AlignmentCosine=0.5

; Provisional combat pistol recoil; geometry tuning pending live rig inspection.
RecoilKickDegrees=8
RecoilSupportScale=0.15
RecoilRecoverySeconds=0.18
RecoilMaxDegrees=35

; Pins show loaded rounds, pointed digits show storage/reserve only.
; Offset: weapon-local meters (+X barrel, +Y left, +Z up); rotations in degrees.
; Grip near display to move/rotate when editing enabled; grip+left trigger to resize.
; Saves placement and size after 400 ms without adjustment. reload-weapon-config applies edits.
[AmmoCounter]
Enabled=1
Stacked=0
EditWithOffHand=0
GrabRadius=0.10
OffsetX=-0.038871
OffsetY=0.013685
OffsetZ=0.044389
RotationX=-2.663572
RotationY=-0.004034
RotationZ=-89.837776
Width=0.021338
Height=0.019697
