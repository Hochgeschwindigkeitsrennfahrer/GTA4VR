; M4 rifle (native type15), installed Animated Weapons w_m4 model.
; Initial profile: magazine/charging-handle bones read from the live model.
; Insertion geometry/hand placement still needs headset tuning.
; Edit the installed file, run tools/game-command.ps1 reload-weapon-config
; while the M4 is equipped, then check reload-status configValid/revision.
[Reload]
MagazineHandRotationX=100
MagazineHandRotationY=180
MagazineHandRotationZ=180
MagazineHandOffsetX=0.075
MagazineHandOffsetY=0.05
MagazineHandOffsetZ=0.04
InsertionAxisX=0
InsertionAxisY=0
InsertionAxisZ=1
MagazineTipX=-0.0421465
MagazineTipY=-0.023525
MagazineTipZ=0.0169907
InsertionTravel=0.05
SnapRadius=0.045
AlignmentCosine=0.5
; Pull the rear charging handle along weapon-local -X, then release.
RackTravel=0.065
RackThreshold=0.05
RackGrabRadius=0.10

RackGripOffsetX=-0.06
RackGripOffsetY=0
RackGripOffsetZ=0
RecoilKickDegrees=6
RecoilSupportScale=0.15
RecoilRecoverySeconds=0.18
RecoilMaxDegrees=75
; Pins show loaded rounds, pointed digits show storage/reserve only.
; Offset: weapon-local meters (+X barrel, +Y left, +Z up); rotations in degrees.
; Grip near display to move/rotate when editing enabled; grip+left trigger to resize.
; Saves placement and size after 400 ms without adjustment. reload-weapon-config applies edits.
[AmmoCounter]
