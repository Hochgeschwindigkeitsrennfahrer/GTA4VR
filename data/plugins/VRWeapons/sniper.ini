; Bolt-action sniper (native type17), external Animated Weapons w_rifle.
; Reload at runtime with tools/game-command.ps1 reload-weapon-config.
[Reload]
MagazineHandRotationX=100
MagazineHandRotationY=180
MagazineHandRotationZ=180
MagazineHandOffsetX=0.075
MagazineHandOffsetY=0.05
MagazineHandOffsetZ=0.04
InsertionAxisX=0
InsertionAxisY=0
InsertionAxisZ=1
; Initial insertion point uses the measured seated magazine pivot.
MagazineTipX=-0.136978
MagazineTipY=0
MagazineTipZ=-0.01641
InsertionTravel=0.05
SnapRadius=0.045
AlignmentCosine=0.5
RackTravel=0.09
RackThreshold=0.065
RackGrabRadius=0.12
RackGripOffsetX=0
RackGripOffsetY=0.04
RackGripOffsetZ=0
RecoilKickDegrees=10
RecoilSupportScale=0.15
RecoilRecoverySeconds=0.18
RecoilMaxDegrees=45

; Weapon-local axes: +X muzzle-forward, +Y sideways, +Z up (meters).
; Reload these alongside [Reload] with reload-weapon-config.
; Initial eyepiece placement; tune for w_rifle in the headset.
RackReturnThreshold=0.015
SupportHandRotationX=0
SupportHandRotationY=0
SupportHandRotationZ=0
SupportHandOffsetX=0
SupportHandOffsetY=0
SupportHandOffsetZ=0

[Scope]
Enabled=1
EyepieceX=-0.251
EyepieceY=0.002
EyepieceZ=0.093
LensRadius=0.018
; Lens surface moves toward the eye, independently of the optical camera.
LensSurfaceOffset=0.001
EyeRelief=0.30
EyeBoxRadius=1.0
VerticalFovDegrees=8
