; SMG / MP5 (native type13), external Animated Weapons w_mp5 model.
; Initial tuning; reload with tools/game-command.ps1 reload-weapon-config.
[Reload]
MagazineHandRotationX=100
MagazineHandRotationY=180
MagazineHandRotationZ=140
MagazineHandOffsetX=0.075
MagazineHandOffsetY=0.05
MagazineHandOffsetZ=0.04
InsertionAxisX=0
InsertionAxisY=0
InsertionAxisZ=1
; Start at the measured seated mag bone pivot; refine against the visible tip.
MagazineTipX=0.20694
MagazineTipY=0.017843
MagazineTipZ=0.005284
InsertionTravel=0.03
SnapRadius=0.045
AlignmentCosine=0.5

RackTravel=0.055
RackThreshold=0.04
RackGrabRadius=0.10
RackGripOffsetX=0
RackGripOffsetY=0.10
RackGripOffsetZ=0
RecoilKickDegrees=3
RecoilSupportScale=0.15
RecoilRecoverySeconds=0.18
RecoilMaxDegrees=35

; Pins show loaded rounds, pointed digits show storage/reserve only.
; Offset: weapon-local meters (+X barrel, +Y left, +Z up); rotations in degrees.
; Grip near display to move/rotate when editing enabled; grip+left trigger to resize.
; Saves placement and size after 400 ms without adjustment. reload-weapon-config applies edits.
[AmmoCounter]
Enabled=1
Stacked=1
EditWithOffHand=0
GrabRadius=0.10
OffsetX=0.037143
OffsetY=0.017270
OffsetZ=0.093283
RotationX=0.152971
RotationY=0.300357
RotationZ=0.813805
Width=0.030685
Height=0.021820
