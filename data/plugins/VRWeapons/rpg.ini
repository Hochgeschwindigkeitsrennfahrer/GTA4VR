; RPG (native type18): shoulder rocket, front insertion; no slide rack.
; Reload edits using tools/game-command.ps1 reload-weapon-config.
[Reload]
MagazineHandRotationX=0
MagazineHandRotationY=90
MagazineHandRotationZ=0
MagazineHandOffsetX=0.08
MagazineHandOffsetY=0.05
MagazineHandOffsetZ=-0.12
; Push rearward along the tube from its front opening.
InsertionAxisX=-1
InsertionAxisY=0
InsertionAxisZ=0
; Seated projectile origin from native weaponInfo, in launcher-local meters.
MagazineTipX=0
MagazineTipY=0
MagazineTipZ=0
InsertionTravel=0.15
SnapRadius=0.06
AlignmentCosine=0.5
; Flip the support palm around its forward axis, retaining the authored seat.
SupportHandRotationX=180
SupportHandRotationY=0
SupportHandRotationZ=180
; Extra loaded depth (meters): positive inward, negative outward.
RocketLoadedDepth=0.09
SupportHandOffsetX=-0.05
SupportHandOffsetY=0
SupportHandOffsetZ=0

; Pins show loaded rounds, pointed digits show storage/reserve only.
; Offset: weapon-local meters (+X barrel, +Y left, +Z up); rotations in degrees.
; Grip near display to move/rotate when editing enabled; grip+left trigger to resize.
; Saves placement and size after 400 ms without adjustment. reload-weapon-config applies edits.
[AmmoCounter]
Enabled=1
Stacked=0
EditWithOffHand=0
GrabRadius=0.10
OffsetX=-0.054778
OffsetY=0.032741
OffsetZ=0.143556
RotationX=0.628691
RotationY=2.156906
RotationZ=-1.219146
Width=0.013748
Height=0.012691
