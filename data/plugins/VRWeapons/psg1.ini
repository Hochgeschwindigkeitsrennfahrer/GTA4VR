; Combat sniper / PSG-1 (native type16), external Animated Weapons w_psg1.
; Reload at runtime with tools/game-command.ps1 reload-weapon-config.
[Reload]
MagazineHandRotationX=100
MagazineHandRotationY=180
MagazineHandRotationZ=140
MagazineHandOffsetX=0.075
MagazineHandOffsetY=0.05
MagazineHandOffsetZ=0.04
InsertionAxisX=0
InsertionAxisY=0
InsertionAxisZ=1
; Initial insertion point uses the measured seated magazine pivot.
MagazineTipX=-0.0139846
MagazineTipY=0.00878203
MagazineTipZ=-0.0202853
InsertionTravel=0.05
SnapRadius=0.045
AlignmentCosine=0.5
RackTravel=0.065
RackThreshold=0.05
RackGrabRadius=0.10
RackGripOffsetX=0
RackGripOffsetY=0.07
RackGripOffsetZ=0.025
RecoilKickDegrees=8
RecoilSupportScale=0.15
RecoilRecoverySeconds=0.18
RecoilMaxDegrees=40

; Weapon-local axes: +X muzzle-forward, +Y sideways, +Z up (meters).
; Reload these alongside [Reload] with reload-weapon-config.
; Eyepiece placement accepted in headset with Animated Weapons.
[Scope]
Enabled=1
EyepieceX=-0.25
EyepieceY=0.007
EyepieceZ=0.122
LensRadius=0.019
; Lens surface moves toward the eye, independently of the optical camera.
LensSurfaceOffset=0.001
EyeRelief=0.30
EyeBoxRadius=0.10
VerticalFovDegrees=8

; Pins show loaded rounds, pointed digits show storage/reserve only.
; Offset: weapon-local meters (+X barrel, +Y left, +Z up); rotations in degrees.
; Grip near display to move/rotate when editing enabled; grip+left trigger to resize.
; Saves placement and size after 400 ms without adjustment. reload-weapon-config applies edits.
[AmmoCounter]
Enabled=1
Stacked=0
EditWithOffHand=0
GrabRadius=0.10
OffsetX=-0.245126
OffsetY=0.006127
OffsetZ=0.071674
RotationX=-0.085031
RotationY=59.144821
RotationZ=-0.962522
Width=0.012280
Height=0.011335
